# Go formatting and static analysis configuration.

version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
  exclusions:
    rules:
      # The standalone gosec CI command scanned production sources only.
      - path: _test\.go$
        linters: [gosec]
  settings:
    gosec:
      excludes: [G103, G115, G304, G404]
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF*", "-SA5002", "-SA1019"]
    govet:
      enable:
        - shadow
      disable:
        - unsafeptr
        # Newer stdlib inlining suggestions cannot target the minimum Go version.
        - inline
formatters:
  exclusions:
    generated: lax
  enable:
    - gofmt
    - goimports
